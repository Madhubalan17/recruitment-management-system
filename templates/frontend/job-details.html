{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details - HireHub</title>
    <meta name="description" content="View job specifications, required qualifications, and apply directly on HireHub.">

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons 1.11.3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="/">
                <span class="brand-icon-box">H</span>
                <span>Hire<span class="text-primary">Hub</span></span>
            </a>

            <div class="d-flex align-items-center gap-2">
                <a href="/jobs/" class="btn btn-light-custom btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Back to Jobs
                </a>
                <div id="navbarAuthActions" class="d-flex align-items-center gap-2"></div>
            </div>
        </div>
    </nav>

    <!-- BREADCRUMB STRIP -->
    <div class="bg-white border-bottom py-2">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0 small">
                    <li class="breadcrumb-item"><a href="/">Home</a></li>
                    <li class="breadcrumb-item"><a href="/jobs/">Jobs</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Position Details</li>
                </ol>
            </nav>
        </div>
    </div>

    <!-- MAIN JOB DETAILS CONTAINER -->
    <main class="py-5">
        <div class="container" id="jobDetails">
            <div class="loading-spinner-wrap">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Retrieving job overview...</p>
            </div>
        </div>
    </main>

    <!-- APPLY JOB MODAL -->
    <div class="modal fade" id="applyJobModal" tabindex="-1" aria-labelledby="applyJobModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <h5 class="modal-title fw-bold" id="applyJobModalLabel">
                            <i class="bi bi-send-fill text-primary me-2"></i>Apply for Position
                        </h5>
                        <small class="text-muted" id="applyModalJobTitle">Position</small>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <form id="jobApplyForm">
                    <div class="modal-body">
                        <input type="hidden" id="applyJobId">

                        <div class="mb-3">
                            <label class="form-label">Upload Resume (PDF, DOC, DOCX) *</label>
                            <input type="file" id="applyResume" class="form-control" accept=".pdf,.doc,.docx" required>
                            <small class="text-muted">Maximum allowed file size: 5MB.</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Cover Letter / Note (Optional)</label>
                            <textarea id="applyCoverLetter" class="form-control" rows="4" placeholder="Describe why you are the ideal fit for this role..."></textarea>
                        </div>

                        <div id="applyMessage"></div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-light-custom" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="applySubmitBtn" class="btn btn-primary">
                            <i class="bi bi-send-fill me-1"></i> Submit Application
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer-custom mt-5">
        <div class="container text-center text-md-start">
            <div class="d-flex flex-wrap justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2 mb-2 mb-md-0">
                    <span class="brand-icon-box">H</span>
                    <span class="fw-bold text-white">Hire<span class="text-primary">Hub</span></span>
                </div>
                <div class="text-secondary small">
                    © 2026 HireHub. Connecting talent with opportunity.
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/api.js' %}?v=2"></script>
    <script src="{% static 'js/jobs.js' %}?v=2"></script>
</body>
</html>
