{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account - HireHub</title>
    <meta name="description" content="Join HireHub as a candidate or employer. Start your hiring or career journey today.">

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons 1.11.3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2">
</head>
<body class="bg-light">

    <!-- NAVIGATION -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="/">
                <span class="brand-icon-box">H</span>
                <span>Hire<span class="text-primary">Hub</span></span>
            </a>
            <a href="/" class="btn btn-light-custom btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Home
            </a>
        </div>
    </nav>

    <main class="py-5">
        <div class="container py-3">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8 col-sm-10">
                    <div class="card-custom bg-white p-4 p-md-5 shadow-lg">
                        <div class="text-center mb-4">
                            <span class="brand-icon-box mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">H</span>
                            <h2 class="fw-bold mb-1">Create Your Account</h2>
                            <p class="text-muted small">Choose your account type and start exploring opportunities.</p>
                        </div>

                        <form id="registerForm">
                            <!-- Role Selection Cards -->
                            <label class="form-label d-block text-center mb-2">I want to join as a:</label>
                            <div class="row g-2 mb-4">
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="registerRole" id="roleCandidate" value="candidate" checked autocomplete="off">
                                    <label class="btn btn-outline-primary w-100 py-3 text-start d-flex align-items-center gap-2" for="roleCandidate">
                                        <i class="bi bi-person-workspace fs-4"></i>
                                        <div>
                                            <div class="fw-bold lh-1">Candidate</div>
                                            <small class="text-muted" style="font-size: 0.72rem;">Looking for a job</small>
                                        </div>
                                    </label>
                                </div>
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="registerRole" id="roleEmployer" value="employer" autocomplete="off">
                                    <label class="btn btn-outline-primary w-100 py-3 text-start d-flex align-items-center gap-2" for="roleEmployer">
                                        <i class="bi bi-building-add fs-4"></i>
                                        <div>
                                            <div class="fw-bold lh-1">Employer</div>
                                            <small class="text-muted" style="font-size: 0.72rem;">Hiring talents</small>
                                        </div>
                                    </label>
                                </div>
                            </div>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Username *</label>
                                    <div class="input-icon-group">
                                        <i class="bi bi-person input-icon"></i>
                                        <input type="text" id="registerUsername" class="form-control" placeholder="johndoe" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Phone Number</label>
                                    <div class="input-icon-group">
                                        <i class="bi bi-telephone input-icon"></i>
                                        <input type="tel" id="registerPhone" class="form-control" placeholder="+91 9876543210">
                                    </div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label">Email Address *</label>
                                    <div class="input-icon-group">
                                        <i class="bi bi-envelope input-icon"></i>
                                        <input type="email" id="registerEmail" class="form-control" placeholder="john@example.com" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Password (Min 8 chars) *</label>
                                    <div class="input-group">
                                        <input type="password" id="registerPassword" class="form-control" placeholder="Min 8 characters" minlength="8" required>
                                        <button class="btn btn-outline-secondary btn-toggle-password" type="button" data-target="registerPassword">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Confirm Password *</label>
                                    <div class="input-group">
                                        <input type="password" id="registerConfirmPassword" class="form-control" placeholder="Repeat password" minlength="8" required>
                                        <button class="btn btn-outline-secondary btn-toggle-password" type="button" data-target="registerConfirmPassword">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="form-check mt-3">
                                <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
                                <label class="form-check-label small text-muted" for="termsCheck">
                                    I agree to HireHub's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
                                </label>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" id="registerSubmitBtn" class="btn btn-primary btn-lg">
                                    <i class="bi bi-person-plus-fill me-1"></i> Register Account
                                </button>
                            </div>

                            <div id="registerMessage" class="mt-3"></div>

                            <div class="text-center mt-4 pt-3 border-top">
                                <span class="small text-muted">Already registered?</span>
                                <a href="/#login" class="small fw-bold ms-1">Sign In to Account</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/api.js' %}?v=2"></script>
    <script src="{% static 'js/auth.js' %}?v=2"></script>
</body>
</html>
